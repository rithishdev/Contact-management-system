<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Contact Management System</title>
</head>

<body>

    <h1>Contact Management System</h1>

    <h2>Add Contact</h2>

    <form id="contactForm">

        <label>Contact ID:</label>
        <input type="text" id="contactId" required>

        <br><br>

        <label>Name:</label>
        <input type="text" id="name" required>

        <br><br>

        <label>Phone:</label>
        <input type="text" id="phone" maxlength="10" required>

        <br><br>

        <label>Email:</label>
        <input type="email" id="email" required>

        <br><br>

        <button type="submit">
            Add Contact
        </button>

    </form>

    <p id="message"></p>

    <hr>

    <h2>All Contacts</h2>

    <button id="refreshButton">
        Refresh Contacts
    </button>

    <br><br>

    <table border="1" cellpadding="8">

        <thead>

            <tr>
                <th>Contact ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody id="contactList"></tbody>

    </table>


<script>

// ======================================================
// ELEMENTS
// ======================================================

const form =
    document.getElementById("contactForm");

const message =
    document.getElementById("message");

const contactList =
    document.getElementById("contactList");


// ======================================================
// GET ALL CONTACTS
// ======================================================

async function getContacts() {

    try {

        message.textContent =
            "Loading contacts...";


        // IMPORTANT:
        // Do NOT use /contacts here.
        // Nimbus uses /proxy/5000/

        const response =
            await fetch("contacts");


        if (!response.ok) {

            throw new Error(
                "Server returned HTTP " +
                response.status
            );

        }


        const contacts =
            await response.json();


        contactList.innerHTML = "";


        if (contacts.length === 0) {

            contactList.innerHTML =
                "<tr>" +
                "<td colspan='5'>" +
                "No contacts found" +
                "</td>" +
                "</tr>";

            message.textContent =
                "No contacts found";

            return;

        }


        contacts.forEach(function(contact) {

            const row =
                document.createElement("tr");


            const idCell =
                document.createElement("td");

            idCell.textContent =
                contact.contactId;


            const nameCell =
                document.createElement("td");

            nameCell.textContent =
                contact.name;


            const phoneCell =
                document.createElement("td");

            phoneCell.textContent =
                contact.phone;


            const emailCell =
                document.createElement("td");

            emailCell.textContent =
                contact.email;


            const actionCell =
                document.createElement("td");


            const deleteButton =
                document.createElement("button");

            deleteButton.textContent =
                "Delete";


            deleteButton.addEventListener(
                "click",
                function() {

                    deleteContact(contact._id);

                }
            );


            actionCell.appendChild(
                deleteButton
            );


            row.appendChild(idCell);
            row.appendChild(nameCell);
            row.appendChild(phoneCell);
            row.appendChild(emailCell);
            row.appendChild(actionCell);


            contactList.appendChild(row);

        });


        message.textContent =
            "Contacts loaded successfully";


    } catch (error) {

        console.error(
            "GET contacts error:",
            error
        );


        message.textContent =
            "Error: " + error.message;

    }

}


// ======================================================
// ADD CONTACT
// ======================================================

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const contact = {

            contactId:
                document
                    .getElementById("contactId")
                    .value
                    .trim(),

            name:
                document
                    .getElementById("name")
                    .value
                    .trim(),

            phone:
                document
                    .getElementById("phone")
                    .value
                    .trim(),

            email:
                document
                    .getElementById("email")
                    .value
                    .trim()

        };


        try {

            const response =
                await fetch("contacts", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(contact)

                });


            const data =
                await response.json();


            message.textContent =
                data.message;


            if (response.ok) {

                form.reset();

                await getContacts();

            }


        } catch (error) {

            console.error(
                "POST contact error:",
                error
            );


            message.textContent =
                "Error: " + error.message;

        }

    }
);


// ======================================================
// DELETE CONTACT
// ======================================================

async function deleteContact(id) {

    if (!confirm(
        "Are you sure you want to delete this contact?"
    )) {

        return;

    }


    try {

        const response =
            await fetch(
                "contacts/" + id,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        message.textContent =
            data.message;


        if (response.ok) {

            await getContacts();

        }


    } catch (error) {

        console.error(
            "DELETE contact error:",
            error
        );


        message.textContent =
            "Error: " + error.message;

    }

}


// ======================================================
// REFRESH BUTTON
// ======================================================

document
    .getElementById("refreshButton")
    .addEventListener(
        "click",
        getContacts
    );


// ======================================================
// LOAD CONTACTS
// ======================================================

getContacts();

</script>

</body>

</html>
